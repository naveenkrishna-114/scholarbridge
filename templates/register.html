{% extends "base.html" %}

{% block title %}Register | ScholarMatch AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card custom-card p-4 shadow-sm">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-primary bg-opacity-10 text-primary mx-auto d-flex align-items-center justify-content-center mb-2" style="width: 56px; height: 56px;">
                        <i class="bi bi-person-plus-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold">Create Account</h3>
                    <p class="text-muted small">Sign up to receive personalized scholarship matches</p>
                </div>

                <form method="POST" action="{{ url_for('views.register_post') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label small fw-semibold">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="name" name="name" required placeholder="e.g. Priya Sharma">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" required placeholder="priya@example.com">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold">Password (min 6 characters)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" minlength="6" required placeholder="••••••••">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3 fw-semibold">
                        <i class="bi bi-rocket-takeoff me-1"></i> Register Free
                    </button>
                </form>

                <div class="text-center small border-top pt-3 text-muted">
                    Already registered? <a href="{{ url_for('views.login_view') }}" class="fw-semibold text-primary">Log in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
